name: Build Base Images

on:
  push:
    # The fork's default branch, not main — main still tracks upstream, so a
    # Containerfile change here would never have rebuilt the Oracle base images.
    branches: [oracle-oci8-support]
    paths:
      - 'internal/podman/quadlets/lerd-php-fpm.Containerfile'
      - 'internal/podman/devtools/**'
      - '.github/workflows/base-images.yml'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild for upstream updates'
        required: false
        default: 'false'

jobs:
  build:
    name: PHP ${{ matrix.php }} (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
        # amd64 only. Oracle publishes no linux.arm64 Instant Client for 21.x
        # (19.x is the newest ARM build), so oci8 cannot link on aarch64 —
        # every arm64 cell failed with "skipping incompatible libclntsh.so".
        # Shipping 19.x on ARM would silently contradict the 21.18 this fork
        # advertises, so the Oracle images are x86_64 until Oracle ships 21.x
        # for ARM. arm64 hosts keep building from source, as they did before.
        arch:
          - { name: amd64, runner: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Compute base image tag and short version
        id: tag
        run: |
          python3 - <<'EOF'
          import hashlib
          with open('internal/podman/quadlets/lerd-php-fpm.Containerfile') as f:
              content = f.read()
          content = content.replace('{{.CustomExtensions}}', '')
          content = content.replace('{{.CustomExtensionsRuntime}}', '')
          content = content.replace('{{.CustomPackages}}', '')
          content = content.replace('{{.MkcertCA}}', '')
          h = hashlib.sha256(content.encode()).hexdigest()[:12]
          print(f'Computed base image tag: {h}')
          with open('/tmp/tag_output', 'w') as f:
              f.write(f'tag={h}\n')
          EOF
          cat /tmp/tag_output >> "$GITHUB_OUTPUT"
          PHP_SHORT=$(echo "${{ matrix.php }}" | tr -d '.')
          echo "php_short=${PHP_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Preprocess Containerfile
        run: |
          python3 - "${{ matrix.php }}" <<'EOF'
          import sys
          version = sys.argv[1]
          with open('internal/podman/quadlets/lerd-php-fpm.Containerfile') as f:
              content = f.read()
          content = content.replace('{{.Version}}', version)
          content = content.replace('{{.CustomExtensions}}', '')
          content = content.replace('{{.CustomExtensionsRuntime}}', '')
          content = content.replace('{{.CustomPackages}}', '')
          content = content.replace('{{.MkcertCA}}', '')
          with open('/tmp/Containerfile', 'w') as f:
              f.write(content)
          EOF

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Force rebuild requested, skipping existence check."
          else
            IMG="ghcr.io/gabriel-sousa99/lerd-php${{ steps.tag.outputs.php_short }}-fpm-base:${{ steps.tag.outputs.tag }}-${{ matrix.arch.name }}"
            if docker manifest inspect "$IMG" > /dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Image already exists, skipping build."
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: /tmp/Containerfile
          push: true
          pull: ${{ inputs.force_rebuild == 'true' }}
          platforms: linux/${{ matrix.arch.name }}
          tags: ghcr.io/gabriel-sousa99/lerd-php${{ steps.tag.outputs.php_short }}-fpm-base:${{ steps.tag.outputs.tag }}-${{ matrix.arch.name }}
          cache-from: type=gha,scope=php-${{ matrix.php }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}-${{ matrix.arch.name }}

      - name: Smoke-test built image
        if: steps.check.outputs.exists != 'true'
        run: |
          IMG="ghcr.io/gabriel-sousa99/lerd-php${{ steps.tag.outputs.php_short }}-fpm-base:${{ steps.tag.outputs.tag }}-${{ matrix.arch.name }}"
          docker pull "$IMG" >/dev/null
          docker run --rm "$IMG" php -m > /tmp/php-modules.txt 2>&1
          COUNT=$(grep -vc '^\[\|^$' /tmp/php-modules.txt)
          echo "PHP ${{ matrix.php }}: $COUNT modules loaded"
          cat /tmp/php-modules.txt
          # Drift guard: catch silent extension drops from Containerfile edits.
          # 50 is the safe floor; new modules push the count up, removed ones
          # trip the check here instead of in users' rebuilds.
          if [ "$COUNT" -lt 50 ]; then
            echo "::error::PHP ${{ matrix.php }} module count dropped to $COUNT (expected >=50)"
            exit 1
          fi
          docker run --rm "$IMG" php -r 'exit(count(PDO::getAvailableDrivers()) >= 3 ? 0 : 1);'
          docker run --rm "$IMG" composer --version >/dev/null

      - name: Set up Go
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The image is the only thing that can falsify BundledExtensions: a name in
      # the always-compiled core group is a claim about upstream php:fpm-alpine
      # that nothing in this repo can contradict. Compare the whole advertised set
      # against `php -m`, which is what the old eight-name spot check never did.
      - name: Verify the image loads every advertised extension
        if: steps.check.outputs.exists != 'true'
        env:
          LERD_PHP_MODULES: /tmp/php-modules.txt
          LERD_PHP_VERSION: ${{ matrix.php }}
        run: go test ./internal/podman -run TestImageReportsAdvertisedExtensions -v

  manifest:
    name: Manifest PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: build
    # Run per version even when a sibling build cell failed: a single arch/version
    # failure must not skip manifest creation for every other version, or the
    # pullable multi-arch tag never publishes and every install falls back to a
    # slow from-source build. fail-fast:false keeps the versions independent.
    if: ${{ !cancelled() }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v4

      - name: Compute base image tag and short version
        id: tag
        run: |
          python3 - <<'EOF'
          import hashlib
          with open('internal/podman/quadlets/lerd-php-fpm.Containerfile') as f:
              content = f.read()
          content = content.replace('{{.CustomExtensions}}', '')
          content = content.replace('{{.CustomExtensionsRuntime}}', '')
          content = content.replace('{{.CustomPackages}}', '')
          content = content.replace('{{.MkcertCA}}', '')
          h = hashlib.sha256(content.encode()).hexdigest()[:12]
          with open('/tmp/tag_output', 'w') as f:
              f.write(f'tag={h}\n')
          EOF
          cat /tmp/tag_output >> "$GITHUB_OUTPUT"
          PHP_SHORT=$(echo "${{ matrix.php }}" | tr -d '.')
          echo "php_short=${PHP_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only — see the matrix comment: oci8 cannot link against Oracle's
      # x64-only Instant Client on aarch64, so there is no arm64 cell to wait on.
      - name: Verify the arch image exists
        run: |
          BASE="ghcr.io/gabriel-sousa99/lerd-php${{ steps.tag.outputs.php_short }}-fpm-base"
          TAG="${{ steps.tag.outputs.tag }}"
          MISSING=""
          for a in amd64; do
            docker manifest inspect "${BASE}:${TAG}-${a}" > /dev/null 2>&1 || MISSING="$MISSING ${a}"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::PHP ${{ matrix.php }} base build did not publish:$MISSING; manifest not created (this version will build from source on install until it is rebuilt)"
            exit 1
          fi

      - name: Check if manifest already exists
        id: check
        run: |
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Force rebuild requested, recreating manifest."
          else
            IMG="ghcr.io/gabriel-sousa99/lerd-php${{ steps.tag.outputs.php_short }}-fpm-base:${{ steps.tag.outputs.tag }}"
            if docker manifest inspect "$IMG" > /dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Manifest already exists, skipping."
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Single-arch for now: listing a ${TAG}-arm64 that no cell publishes makes
      # imagetools fail and the pullable ${TAG} never appears, which is what
      # sends every install back to a from-source build.
      - name: Create and push the manifest
        if: steps.check.outputs.exists != 'true'
        run: |
          BASE="ghcr.io/gabriel-sousa99/lerd-php${{ steps.tag.outputs.php_short }}-fpm-base"
          TAG="${{ steps.tag.outputs.tag }}"
          docker buildx imagetools create \
            --tag "${BASE}:${TAG}" \
            "${BASE}:${TAG}-amd64"
